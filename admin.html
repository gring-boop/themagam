<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>더마감 관리자 🛡️</title>

  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">

  <!-- Firebase (compat) — 메인과 같은 9.17.1 -->
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">

  <!-- 메인 스타일 재사용 (변수·버튼·set-block 등) -->
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* =================================================================
       관리자 페이지 전용 — 입장 창 리디자인과 같은 결.
       원고지 종이(#FAF6EC) + 격자, 붉은 테두리 카드, 명조 제목.
       ================================================================= */
    html, body{
      height: auto; min-height: 100%;
      overflow: auto;
      display: block;
      background: #FAF6EC;
      background-image:
        repeating-linear-gradient(90deg, transparent 0 23px, rgba(163,88,70,.14) 23px 24px),
        repeating-linear-gradient( 0deg, transparent 0 23px, rgba(163,88,70,.14) 23px 24px);
    }
    .adm-wrap{
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }
    .adm-eyebrow{
      text-align: center; font-size: 11px; color: #B3372B;
      letter-spacing: 1px; font-weight: 600; margin-bottom: 6px;
    }
    .adm-title{
      font-family: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
      text-align: center; letter-spacing: 3px; color: #2B2620;
      font-size: 26px; font-weight: 700; margin: 0 0 2px;
    }
    .adm-en{
      text-align: center; font-size: 11px; color: #B3372B;
      letter-spacing: 4px; margin: 2px 0 22px;
    }
    .adm-card{
      background: rgba(255,253,246,.96);
      border: 1.5px solid #B3372B;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(90,70,40,.10);
      padding: 18px 18px 16px;
      margin-bottom: 16px;
      color: #2B2620;
    }
    .adm-card h2{
      font-family: "Noto Serif KR", serif;
      font-size: 16px; font-weight: 700; color: #2B2620;
      margin: 0 0 10px; letter-spacing: .5px;
    }
    .adm-sub{ font-size: 12.5px; color: #6B5F52; margin: 0 0 12px; }
    .adm-card input[type="text"], .adm-card input[type="password"],
    .adm-card input[type="number"], .adm-card textarea{
      width: 100%;
      background: transparent; border: none;
      border-bottom: 1px solid rgba(150,120,80,.5); border-radius: 0;
      color: #2B2620; box-shadow: none; padding: 8px 4px;
      font: inherit; font-size: 15px;
    }
    .adm-card input:focus, .adm-card textarea:focus{
      outline: none; border-bottom-color: #B3372B;
    }
    .adm-card textarea{
      border: 1px solid rgba(150,120,80,.5); border-radius: 8px;
      min-height: 70px; resize: vertical;
    }
    .adm-btn{
      display: inline-block; cursor: pointer;
      background: #4A140D; color: #FFFDF6; border: none;
      border-radius: 8px; padding: 10px 16px;
      font-weight: 600; font-size: 14px;
    }
    .adm-btn:hover{ background: #5C1A11; }
    .adm-btn.ghost{
      background: transparent; color: #4A140D;
      border: 1px solid rgba(150,120,80,.6);
    }
    .adm-btn.ghost:hover{ background: rgba(163,88,70,.08); }
    .adm-btn.danger{ background: #B3372B; }
    .adm-btn.danger:hover{ background: #C74334; }
    .adm-btn.w-full{ display: block; width: 100%; }
    .adm-msg{ font-size: 12.5px; color: #6B5F52; margin-top: 8px; min-height: 1em; }
    .adm-msg.bad{ color: #B3372B; font-weight: 700; }
    .adm-row{
      display: flex; align-items: center; gap: 10px;
      padding: 7px 2px; border-bottom: 1px dashed rgba(150,120,80,.4);
      font-size: 13px;
    }
    .adm-row .n{ flex: 1; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .adm-row .s{ flex: 0 0 auto; color: #6B5F52; font-size: 12px; }
    .adm-vac-dates{ font-size: 11.5px; color: #8A7B68; padding: 2px 2px 8px; }
    .adm-nav{
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 8px; font-weight: 700;
    }
    .adm-nav button{
      cursor: pointer; background: transparent; border: 1px solid rgba(150,120,80,.5);
      border-radius: 6px; width: 28px; height: 28px; color: #4A140D; font-size: 15px;
    }
    .adm-nav button:disabled{ opacity: .35; cursor: default; }
    .adm-radio{ display: block; font-size: 13.5px; padding: 4px 0; cursor: pointer; }
    .adm-gap{ height: 10px; }
    #adm-dash{ display: none; }
  </style>
</head>
<body>
  <div class="adm-wrap">
    <div class="adm-eyebrow">— WRITERS' ROOM —</div>
    <h1 class="adm-title">더마감 관리자</h1>
    <div class="adm-en">THEMAGAM · ADMIN</div>

    <!-- ① 로그인 (메인과 같은 필명+비밀번호) -->
    <div class="adm-card" id="adm-login">
      <h2>🔐 로그인</h2>
      <p class="adm-sub">메인 방에서 쓰는 닉네임과 비밀번호로 들어와요.</p>
      <input type="text" id="adm-nick" placeholder="닉네임" autocomplete="username" />
      <div class="adm-gap"></div>
      <input type="password" id="adm-pw" placeholder="비밀번호" autocomplete="current-password" />
      <div class="adm-gap"></div>
      <button class="adm-btn w-full" id="adm-login-btn">로그인</button>
      <div class="adm-msg" id="adm-login-msg"></div>
    </div>

    <!-- ② 관리자 PIN -->
    <div class="adm-card" id="adm-pin-card" style="display:none;">
      <h2>🛡️ 관리자 PIN</h2>
      <p class="adm-sub">관리자 PIN을 입력해야 대시보드가 열려요.</p>
      <input type="password" id="adm-pin" placeholder="PIN" inputmode="numeric" />
      <div class="adm-gap"></div>
      <button class="adm-btn w-full" id="adm-pin-btn">확인</button>
      <div class="adm-msg" id="adm-pin-msg"></div>
    </div>

    <!-- ③ 대시보드 -->
    <div id="adm-dash">
      <div class="adm-card" id="adm-att-card">
        <h2>📅 출석·휴가 현황</h2>
        <p class="adm-sub">멤버별 최근 30일 출석과 휴가 기록이에요.</p>
        <div class="adm-nav">
          <button type="button" id="adm-att-prev" title="지난 달">‹</button>
          <span id="adm-att-month"></span>
          <button type="button" id="adm-att-next" title="다음 달">›</button>
        </div>
        <div id="adm-att-body" class="adm-msg">불러오는 중…</div>
      </div>

      <div class="adm-card">
        <h2>📌 공지 관리</h2>
        <p class="adm-sub">방 머리말에 고정되는 공지예요. 비우고 저장하면 내려가요.</p>
        <textarea id="adm-notice"></textarea>
        <div class="adm-gap"></div>
        <button class="adm-btn" id="adm-notice-save">저장</button>
        <button class="adm-btn ghost" id="adm-notice-clear">공지 내리기</button>
        <div class="adm-msg" id="adm-notice-msg"></div>
      </div>

      <div class="adm-card">
        <h2>💬 채팅 관리</h2>
        <p class="adm-sub">히스토리 노출 설정과 전체 삭제예요.</p>
        <label class="adm-radio"><input type="radio" name="adm-hist" value="on"> 🕘 전체 공개 — 모두에게 이전 대화가 보여요</label>
        <label class="adm-radio"><input type="radio" name="adm-hist" value="admin"> 🛡️ 관리자만 — 관리자만 볼 수 있어요</label>
        <label class="adm-radio"><input type="radio" name="adm-hist" value="off"> 🙈 숨김 — 아무에게도 보이지 않아요</label>
        <div class="adm-gap"></div>
        <input type="number" id="adm-hist-count" min="10" max="300" placeholder="표시 개수 (10~300)" />
        <div class="adm-gap"></div>
        <button class="adm-btn" id="adm-hist-apply">히스토리 설정 적용</button>
        <div class="adm-gap"></div>
        <button class="adm-btn danger" id="adm-chat-clear">🧹 채팅 전체 삭제</button>
        <button class="adm-btn danger" id="adm-chatty-clear">☕ Chatty 전체 삭제</button>
        <div class="adm-msg" id="adm-chat-msg"></div>
      </div>

      <div class="adm-card">
        <h2>✍️ 글자수 관리</h2>
        <p class="adm-sub">오늘 날짜의 글자수 기록·말풍선을 모두 지워요.</p>
        <button class="adm-btn danger" id="adm-wc-clear">오늘 글자수 전체 초기화</button>
        <div class="adm-msg" id="adm-wc-msg"></div>
      </div>
    </div>
  </div>

  <script src="script_admin.js"></script>
</body>
</html>
